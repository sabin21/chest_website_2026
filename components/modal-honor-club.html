<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles/app_common.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/honor.css" />
</head>
<body>

<div class="modal-club-wrap" data-lenis-prevent>
  <div class="modal-top-bar">
    <span class="club-menu-wrap">
      <button class="club-menu-item">서울</button>
      <button class="club-menu-item">부산</button>
      <button class="club-menu-item">대구</button>
      <button class="club-menu-item">광주</button>
      <button class="club-menu-item">인천</button>
      <button class="club-menu-item">울산</button>
      <button class="club-menu-item">대전</button>
      <button class="club-menu-item">세종</button>
      <button class="club-menu-item">경기</button>
      <button class="club-menu-item">강원</button>
      <button class="club-menu-item">충북</button>
      <button class="club-menu-item">충남</button>
      <button class="club-menu-item">경북</button>
      <button class="club-menu-item">경남</button>
      <button class="club-menu-item active">전북</button>
      <button class="club-menu-item">전남</button>
      <button class="club-menu-item">제주</button>
      <button class="club-menu-item">중앙회</button>
    </span>
    <button class="btn-modal-close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2L14 14M14 2L2 14" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="club-title-bar">
    <h2 class="club-title">전북</h2>
    <span class="club-title-eng">Honor Society of jeonbuk</span>
  </div>
  
  <div class="club-hero-wrap">
    <div class="club-hero-img">
      <img src="../img/honor/club_hero_jeonbuk.png">
    </div>
    <div class="hero-title-wrap">
      <span class="headline-row-1">나눔을 통한 지역과의 아름다운 동행</span>
      <span class="headline-row-2">전북 아너 소사이어티</span>
      <p class="headcopy">
        전북 아너 소사이어티 클럽은 노블레스 오블리주의 정신을 바탕으로 2014년 1월 창단하여<br class="md-hidden">
        2024년 6월 107명의 회원으로 구성되어 있다. 중견, 대기업의 불모지라 불리는 전북특별자치도에서<br class="md-hidden"> 
        개인 기부는 나눔문화로 활성화 되어 있으며 지속적인 봉사활동과 나눔활동을 하고 있다.<br class="md-hidden"> 
        앞으로도 전북특별자치도의 진정한 나눔 문화를 이끄는 클럽이 될 수 있도록 혼신의 힘을 다해 노력할 것이다.
      </p>
    </div>
  </div>

  <div class="club-body-wrap">
    <img src="../img/honor/club_modal_body_dummy.png">
  </div>
  </div>

</body>
</html>
