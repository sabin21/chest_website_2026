<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>희망 2027 나눔캠페인</title>
  <link rel="stylesheet" href="./css/type_d.css">
</head>
<body>
<div class="page-wrap">

  <div class="block-l">
    <header class="campaign-header">
      <a class="chest-logo" href="https://www.chest.or.kr/">
        <img src="./img/logo_default.png" />
      </a>
      <a class="btn-goto-home" href="https://www.chest.or.kr/">
        홈페이지 바로가기
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 14L11 8L5 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>
    <div class="hero-inner">
      <img src="./img/d_hero.png" />
    </div>
  </div>

  <div class="block-r">
    <div class="video-wrap">
      <video muted loop playsinline>
        <source src="./video/hero_video_1.mp4" type="video/mp4">
      </video>
    </div>
    <div class="item-link" id="item-donate">
      <h4 class="item-title">기부참여하기</h4>
    </div>
    <div class="item-link" id="item-local">
      <h4 class="item-title">지역별 <br>모금현황보기</h4>
    </div>
  </div>



</div>

</body>
</html>
