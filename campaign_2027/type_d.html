<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>희망2027 나눔캠페인</title>
  <link rel="stylesheet" href="./css/type_d.css">
</head>
<body>
<div class="page-wrap">

  <div class="block-l">
    <header class="campaign-header">
      <a class="chest-logo" href="https://www.chest.or.kr/">
        <img src="./img/logo_default.png" />
      </a>
      <a class="btn-goto-home" href="https://www.chest.or.kr/">
        홈페이지 바로가기
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 14L11 8L5 2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </header>
    <div class="hero-inner">
      <img src="./img/d_hero.png" />
    </div>
  </div>

  <div class="block-r">
    <div class="video-wrap">
      <video autoplay muted loop playsinline>
        <source src="./video/hero_video_1.mp4" type="video/mp4">
      </video>
    </div>
    <div class="item-link" id="item-donate">
      <h4 class="item-title">기부참여하기</h4>
    </div>
    <div class="item-link" id="item-local">
      <h4 class="item-title">지역별 <br>모금현황보기</h4>
    </div>
    <div class="popup-local">
      <h3 class="popup-title">지역별 모금현황</h3>
      <button class="btn-close">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4.34277 4.34302L10.0001 10.0004M10.0001 10.0004L15.6569 15.6572M10.0001 10.0004L15.6571 4.3434M10.0001 10.0004L4.3429 15.6576" stroke-width="2" stroke-linecap="round" stroke="white"/>
        </svg>
      </button>
      <div class="map-content">
        <img src="./img/d_map.png" />
      </div>
      <img src="./img/d_map_pict.png" class="pict" />
    </div>
  </div>
</div>

<script>
  // 지역별 모금현황 팝업 열기 / 닫기
  const popupLocal = document.querySelector('.popup-local');
  document.getElementById('item-local').addEventListener('click', () => {
    popupLocal.classList.add('active');
  });
  popupLocal.querySelector('.btn-close').addEventListener('click', () => {
    popupLocal.classList.remove('active');
  });
</script>

</body>
</html>
