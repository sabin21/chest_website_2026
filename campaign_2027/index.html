<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사랑의 온도탑</title>
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view" aria-label="사랑의 온도탑 3D 모델"></canvas>
<header>
  <h1>사랑의 온도탑</h1>
  <p>드래그해서 돌려 보고, 아래에서 나눔온도를 올려 보세요.</p>
</header>
<div id="loading">모델 불러오는 중… <span id="pct">0%</span></div>

<div class="panel" role="group" aria-label="온도탑 조작">
  <div class="row">
    <span class="temp" id="tempLabel">50.0°</span>
    <input id="temp" type="range" min="0" max="100" step="0.5" value="50" aria-label="나눔온도">
  </div>
  <div class="row">
    <button id="rotateBtn" class="primary" type="button" aria-pressed="false">자동 회전</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
