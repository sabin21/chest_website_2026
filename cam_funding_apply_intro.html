<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template-basic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12.1.3/swiper-bundle.min.css" />
  <link rel="stylesheet" href="styles/app_common.css" />
  <link rel="stylesheet" href="styles/depth_template.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/campaign.css" />
</head>

<body>

<div id="app-root" class="app-root">
  <main class="app-main">

    <div id="app-header" class="app-header"></div>

    <div id="app-breadcrumb" class="depth-head"></div>

    <div class="container-root">

      <div class="container">
        <div class="page-head-wrap">
          <div class="depth-page-title-wrap">
            <div class="depth-page-title">
              <h1>열매모아</h1>
            </div>
          </div>
          <div class="depth-visual-wrap">
            <img src="img/character_03.png"/>
          </div>

          <div class="page-head-gnb-wrap">
            <a href="./cam_funding_list.html" class="btn-page-head">펀딩전체보기</a>
            <a href="./cam_funding_intro.html" class="btn-page-head">소개</a>
            <a href="./cam_funding_apply_intro.html" class="btn-page-head active">신청안내</a>
            <a href="./cam_funding_apply.html" class="btn-page-head">신청하기</a>
          </div>
        </div>
      </div><!-- container-->

      <div class="container pt-80">
        <div class="container-col-3-9">
          <div class="title-left-section">
            <h3 class="title">신청조건 및 절차</h3>
          </div>
          <div class="funding-apply-intro-cards">
            <div class="card-panel">
              <span class="title-wrap">
                <h4 class="title">신청자격</h4>
                <P>
                  비영리단체 및 사회복지단체<br>(*영리 기업, 영리 사업 신청 불가)
                </P>
              </span>
              <img src="./img/campaign/intro_pictogram_1.svg" />
            </div>
            <div class="card-panel">
              <span class="title-wrap">
                <h4 class="title">신청내용</h4>
                <P>
                  사회복지사업, 비영리 공익사업<br>(*최대 500만원까지 신청 가능)
                </P>
              </span>
              <img src="./img/campaign/intro_pictogram_2.svg" />
            </div>
            <div class="card-panel">
              <span class="title-wrap">
                <h4 class="title">진행일정</h4>
                <P>
                  매월 마지막 주 접수 마감후<br>
                  익월 초 소위원회 사례심사 진행<br>
                  (매월 1~2건 선정하나 접수 건수에<br>따라 일정이 달라질 수 있음)
                </P>
              </span>
              <img src="./img/campaign/intro_pictogram_3.svg" />
            </div>
            <div class="card-panel">
              <span class="title-wrap">
                <h4 class="title">선정결과</h4>
                <P>
                  심시 후 유선 및 E-Mail 개별 안내
                </P>
              </span>
              <img src="./img/campaign/intro_pictogram_4.svg" />
            </div>
          </div>
        </div>
        <img src="./img/dummy_sample/funding_apply_intro.png" class="dummy-image">
      </div><!-- container-->


    </div><!-- container-root -->

    <div id="app-footer" class="app-footer"></div>
    <div id="app-quick-link" class="app-quick-link"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.23/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@12.1.3/swiper-bundle.min.js"></script>
<script src="components/AppHeader.js"></script>
<script src="components/Breadcrumb.js"></script>
<script src="components/AppFooter.js"></script>
<script src="components/AppQuickLink.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="js/app_common.js"></script>
</body>

</html>
